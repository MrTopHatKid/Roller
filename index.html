<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Roller</title>
  <style>
    :root{--bg:#080b13;--surface:#111827;--line:#2a3953;--text:#f7f9ff;--muted:#9dabc0;--gold:#ffc43d;--orange:#f08a28}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(1000px 500px at 50% -120px,#294b85 0%,#121b2b 43%,var(--bg) 100%)}.shell{width:min(1160px,calc(100% - 32px));margin:auto;padding:22px 0 72px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 24px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.04em;font-size:1.15rem}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#221300;font-size:.9rem}.mode{border:1px solid #3a5174;border-radius:999px;padding:7px 11px;color:#b6dfff;background:#102038;font-size:.74rem;font-weight:800;letter-spacing:.08em}.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:30px 34px;margin-bottom:18px;border:1px solid #344866;border-radius:22px;background:linear-gradient(125deg,#152846 0%,#101a2b 55%,#111728 100%);box-shadow:0 24px 60px #0004}.eyebrow{margin:0 0 7px;color:var(--gold);font-size:.72rem;font-weight:900;letter-spacing:.17em}.hero h1{margin:0;max-width:620px;font-size:clamp(2.1rem,6vw,4.6rem);line-height:.95;letter-spacing:-.07em}.hero p{margin:15px 0 0;max-width:590px;color:var(--muted)}.hero-icon{display:grid;place-items:center;width:95px;height:95px;border:1px solid #48678c;border-radius:22px;background:radial-gradient(circle at 35% 25%,#426da4,#1d2f4a 60%,#142137);font-size:2.8rem}.control-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 14px 35px #0003}.controls{display:grid;grid-template-columns:1.2fr 1fr 120px auto;gap:12px}.field{display:grid;gap:6px}.field-label{color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.pick-file,select,input,button{font:inherit;border-radius:10px}.pick-file,select,input{height:48px;border:1px solid #34445f;background:#0b1220;color:var(--text)}.pick-file{display:flex;align-items:center;padding:0 14px;cursor:pointer;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick-file input{display:none}select,input{width:100%;padding:0 12px}input{text-align:center}.roll-button{align-self:end;height:48px;padding:0 24px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--orange));color:#241500;font-weight:950;cursor:pointer}.roll-button:disabled,select:disabled,input:disabled{opacity:.45;cursor:not-allowed}.status{min-height:23px;margin:13px 2px 0;color:var(--muted);font-size:.88rem}.error{color:#ff9696}.section-label{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px;color:#dce6f7;font-weight:850;font-size:.86rem;letter-spacing:.04em}.section-label span{color:var(--muted);font-size:.72rem;font-weight:700}.rollers{display:grid;gap:10px}.roller{position:relative;height:142px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#05080d;box-shadow:inset 0 0 35px #000;opacity:0;transform:translateY(8px) scale(.985)}.roller.ready{animation:laneEnter .38s cubic-bezier(.16,.86,.25,1) forwards}@keyframes laneEnter{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}.roller:before,.roller:after{content:"";position:absolute;z-index:1;top:0;bottom:0;width:16%;pointer-events:none}.roller:before{left:0;background:linear-gradient(90deg,#05080d,transparent)}.roller:after{right:0;background:linear-gradient(-90deg,#05080d,transparent)}.pointer{position:absolute;z-index:3;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:var(--gold);box-shadow:0 0 15px var(--gold)}.pointer:before,.pointer:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-right:10px solid transparent;border-left:10px solid transparent}.pointer:before{top:0;border-top:11px solid var(--gold)}.pointer:after{bottom:0;border-bottom:11px solid var(--gold)}.reel{display:flex;gap:8px;padding:10px;transform:translateX(-52px);will-change:transform}.reel img{width:122px;height:120px;flex:0 0 122px;display:block;object-fit:cover;border:1px solid #394760;border-radius:8px;background:#172234}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.result-card{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 8px 18px #0002;animation:appear .28s ease-out}.result-card img{display:block;width:100%;height:155px;object-fit:cover;background:#05080d}.result-card p{margin:0;padding:10px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem;color:#dce5f2}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.history{margin-top:24px;border:1px solid var(--line);border-radius:15px;background:var(--surface)}.history summary{padding:15px 17px;cursor:pointer;font-weight:850;color:#e3ebf8}.history-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:0 14px 14px}.history-item{overflow:hidden;border:1px solid #293852;border-radius:10px;background:#0b1220}.history-item img{display:block;width:100%;height:100px;object-fit:cover;background:#05080d}.history-item p{margin:0;padding:8px;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dce5f2}.empty-history{margin:0;padding:0 16px 16px;color:var(--muted)}@media(max-width:760px){.shell{width:min(100% - 18px,1160px)}.hero{grid-template-columns:1fr;padding:25px}.hero-icon{display:none}.controls{grid-template-columns:1fr 1fr}.roll-button{grid-column:span 2}.reel img{width:108px;flex-basis:108px}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.topbar{padding-bottom:16px}.mode{font-size:.65rem}.hero{padding:22px}.controls{grid-template-columns:1fr}.roll-button{grid-column:auto}.reel img{width:90px;flex-basis:90px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">◆</span>Photo Roller</div><span class="mode">LOCAL MODE</span></header>
    <section class="hero"><div><p class="eyebrow"></p><h1>NERF CASE OPENER</h1><p>Choose a folder, set the number of rolls.</p></div><div ></div></section>
    <section class="control-card"><div class="controls"><label class="field"><span class="field-label">Project folder</span><span class="pick-file" id="pickerLabel">Choose project folder<input id="folderPicker" type="file" webkitdirectory directory multiple accept="image/jpeg"></span></label><label class="field"><span class="field-label">Collection</span><select id="folder" disabled><option>Choose a project folder first</option></select></label><label class="field"><span class="field-label">Rolls</span><input id="amount" type="number" min="1" max="8" value="1" disabled></label><button id="roll" class="roll-button" type="button" disabled>Roll now</button></div><p id="status" class="status">Choose your local project folder first.</p></section>
    <div class="section-label"><b>Live rolls</b><span></span></div><section id="rollers" class="rollers"></section><div class="section-label"><b>Latest results</b><span></span></div><section id="results" class="results" aria-live="polite"></section><details class="history"><summary>History · Latest 10 rolls</summary><div id="historyList" class="history-list"></div></details>
  </main>
  <script>
    const picker=document.querySelector("#folderPicker"),pickerLabel=document.querySelector("#pickerLabel"),select=document.querySelector("#folder"),amount=document.querySelector("#amount"),rollButton=document.querySelector("#roll"),rollers=document.querySelector("#rollers"),status=document.querySelector("#status"),results=document.querySelector("#results"),historyList=document.querySelector("#historyList");const selectionKey="photo-roller.selected-folder",historyKey="photo-roller.history.v1";let byFolder=new Map(),isRolling=false,thumbnailCache=new Map(),originalUrls=new Map();const random=items=>items[Math.floor(Math.random()*items.length)];function resetControls(d){select.disabled=d;amount.disabled=d;rollButton.disabled=d}function folderFor(f){const p=f.webkitRelativePath.split("/");return p.length>2?p[1]:"root"}function clearCache(){thumbnailCache.forEach(URL.revokeObjectURL);originalUrls.forEach(URL.revokeObjectURL);thumbnailCache.clear();originalUrls.clear()}function originalUrl(f){if(!originalUrls.has(f))originalUrls.set(f,URL.createObjectURL(f));return originalUrls.get(f)}async function thumbnail(f){if(thumbnailCache.has(f))return thumbnailCache.get(f);try{const b=await createImageBitmap(f),s=Math.min(260/b.width,200/b.height,1),c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.width*s));c.height=Math.max(1,Math.round(b.height*s));c.getContext("2d").drawImage(b,0,0,c.width,c.height);b.close();const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82)),url=URL.createObjectURL(blob);thumbnailCache.set(f,url);return url}catch{const url=originalUrl(f);thumbnailCache.set(f,url);return url}}async function prepare(files){await Promise.all([...new Set(files)].map(thumbnail))}function history(){try{return JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{return[]}}function saveHistory(winners){const latest=winners.map(f=>({name:f.name,path:f.webkitRelativePath,folder:folderFor(f)}));localStorage.setItem(historyKey,JSON.stringify([...latest,...history()].slice(0,10)))}function findFile(r){return byFolder.get(r.folder)?.find(f=>f.webkitRelativePath===r.path)}function renderHistory(){const records=history();historyList.replaceChildren();if(!records.length){historyList.innerHTML='<p class="empty-history">No rolls yet.</p>';return}records.forEach(r=>{const item=document.createElement("article");item.className="history-item";const file=findFile(r);if(file){const img=document.createElement("img");img.src=thumbnailCache.get(file)||originalUrl(file);img.alt=r.name;item.append(img)}const p=document.createElement("p");p.textContent=r.name;item.append(p);historyList.append(item)})}
    picker.addEventListener("change",()=>{clearCache();byFolder=new Map();results.replaceChildren();rollers.replaceChildren();[...picker.files].filter(f=>/\.jpe?g$/i.test(f.name)).forEach(f=>{const folder=folderFor(f);if(!byFolder.has(folder))byFolder.set(folder,[]);byFolder.get(folder).push(f)});select.replaceChildren();[...byFolder.keys()].sort().forEach(f=>select.add(new Option(`${f} (${byFolder.get(f).length})`,f)));const saved=localStorage.getItem(selectionKey);select.value=byFolder.has(saved)?saved:select.options[0]?.value;pickerLabel.firstChild.textContent="Change project folder";resetControls(!byFolder.size);status.innerHTML=byFolder.size?"":'<span class="error">No JPG or JPEG photos were found in that folder.</span>';renderHistory()});select.addEventListener("change",()=>localStorage.setItem(selectionKey,select.value));rollButton.addEventListener("click",startRoll);
    async function startRoll(){if(isRolling)return;const files=byFolder.get(select.value),total=Math.max(1,Math.min(8,parseInt(amount.value,10)||1));amount.value=total;if(!files?.length)return;isRolling=true;resetControls(true);results.replaceChildren();rollers.replaceChildren();status.textContent="Preparing smooth previews…";const lanes=Array.from({length:total},()=>{const cards=Array.from({length:48},()=>random(files)),winner=random(files);cards[40]=winner;return{cards,winner}});await prepare(lanes.flatMap(l=>l.cards));await Promise.all(lanes.map(addLane));status.textContent="Getting ready…";requestAnimationFrame(()=>{document.querySelectorAll(".roller").forEach((row,i)=>setTimeout(()=>row.classList.add("ready"),i*35));setTimeout(()=>{status.textContent="Rolling…";animateLanes()},280)});setTimeout(()=>{const winners=lanes.map(l=>l.winner);showResults(winners);saveHistory(winners);renderHistory();status.textContent="";isRolling=false;resetControls(false)},4900)}
    async function addLane(lane){const row=document.createElement("div");row.className="roller";row.innerHTML='<div class="pointer"></div><div class="reel"></div>';const reel=row.querySelector(".reel");for(const f of lane.cards){const img=document.createElement("img");img.src=await thumbnail(f);img.alt="";reel.append(img)}rollers.append(row)}function animateLanes(){document.querySelectorAll(".reel").forEach(reel=>{const img=reel.firstElementChild,w=img.getBoundingClientRect().width+8,parent=reel.parentElement,offset=40*w-parent.getBoundingClientRect().width/2+w/2;reel.style.transition="transform 4.55s cubic-bezier(.05,.85,.12,1)";reel.style.transform=`translateX(-${offset}px)`})}function showResults(winners){const frag=document.createDocumentFragment();winners.forEach(f=>{const a=document.createElement("article");a.className="result-card";const img=document.createElement("img");img.src=thumbnailCache.get(f)||originalUrl(f);img.alt=f.name;const p=document.createElement("p");p.textContent=f.name;a.append(img,p);frag.append(a)});results.replaceChildren(frag)}renderHistory();window.addEventListener("beforeunload",clearCache);
  </script>
</body>
</html>
